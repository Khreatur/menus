<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menus</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      background: #faf9f6;
      color: #2c2c2c;
      min-height: 100vh;
    }

    /* ---- HEADER ---- */
    header {
      background: #3a3028;
      color: #f0ece3;
      padding: 16px 24px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    header h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f0ece3;
    }

    header .subtitle {
      font-size: 0.72rem;
      opacity: 0.55;
      font-style: italic;
    }

    .error-msg {
      text-align: center;
      padding: 60px 24px;
      color: #888;
      font-style: italic;
    }

    /* =========================================
       DESKTOP — GRILLE CALENDRIER
    ========================================= */
    @media (min-width: 769px) {
      #mobile-view { display: none; }

      #desktop-view {
        display: block;
        padding: 28px 24px;
        overflow-x: auto;
      }

      /* Bloc semaine */
      .week-block { margin-bottom: 36px; }

      .week-title {
        background: #3a3028;
        color: #f0ece3;
        font-family: 'Poppins', sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 8px 14px;
        border-radius: 8px 8px 0 0;
        margin-bottom: 0;
      }

      /* Grille jours */
      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
        padding: 12px 0;
        border: 1px solid #e0dbd0;
        border-top: none;
        border-radius: 0 0 8px 8px;
        padding: 12px;
        background: #faf9f6;
      }

      .day-col {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .day-col-header {
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #5a5248;
        text-align: center;
        padding-bottom: 6px;
        border-bottom: 1px solid #e8e3d8;
      }

      /* Colonne aujourd'hui */
      .today-col .day-col-header {
        color: #3a3028;
        font-weight: 700;
      }

      .today-col .meal-slot {
        border-color: #856404;
        background: #fffbf0;
      }

      /* Créneau repas */
      .meal-slot {
        background: white;
        border: 1px solid #e8e3d8;
        border-radius: 8px;
        padding: 8px 10px;
        min-height: 68px;
      }

      /* Badges midi / soir — alignés sur style.css */
      .meal-badge {
        font-size: 0.6rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        display: inline-block;
        padding: 1px 6px;
        border-radius: 20px;
        margin-bottom: 5px;
      }

      .meal-badge.midi { background: #fff3cd; color: #856404; }
      .meal-badge.soir { background: #e8eaf6; color: #3949ab; }

      /* Chips recettes */
      .recipe-chip {
        display: flex;
        align-items: flex-start;
        gap: 5px;
        font-size: 0.8rem;
        line-height: 1.35;
        color: #2c2c2c;
        margin-bottom: 4px;
      }

      .recipe-icon { flex-shrink: 0; font-size: 0.9rem; }

      .recipe-chip span[style*="cursor"] {
        color: #2c2c2c;
      }

      .recipe-chip span[style*="cursor"]:hover {
        text-decoration: underline;
        color: #3a3028;
      }

      .empty-slot {
        color: #d0c9bf;
        font-size: 0.78rem;
        font-style: italic;
      }
    }

    /* =========================================
       MOBILE — VUE PAR CRÉNEAU
    ========================================= */
    @media (max-width: 768px) {
      #desktop-view { display: none; }
      #mobile-view { display: block; }

      .mobile-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        background: #f0ece3;
        border-bottom: 1px solid #e8e3d8;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .nav-btn {
        background: none;
        border: none;
        font-size: 1.4rem;
        cursor: pointer;
        color: #3a3028;
        padding: 4px 8px;
        opacity: 0.7;
      }

      .nav-btn:disabled { opacity: 0.2; }

      .nav-day-label { text-align: center; flex: 1; }

      .nav-day-label .day-name {
        font-family: 'Poppins', sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        color: #3a3028;
      }

      .nav-day-label .week-name {
        font-size: 0.7rem;
        color: #5a5248;
        margin-top: 2px;
        font-style: italic;
      }

      .mobile-day-content { padding: 24px 20px; }
      .mobile-meal-block { margin-bottom: 24px; }

      .mobile-meal-label {
        font-family: 'Poppins', sans-serif;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 10px;
        display: inline-block;
        padding: 2px 8px;
        border-radius: 20px;
      }

      .mobile-meal-label.midi { background: #fff3cd; color: #856404; }
      .mobile-meal-label.soir { background: #e8eaf6; color: #3949ab; }

      .mobile-recipe {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 14px;
        background: white;
        border: 1px solid #e8e3d8;
        border-radius: 8px;
        margin-bottom: 8px;
      }

      .mobile-recipe-icon { font-size: 1.3rem; flex-shrink: 0; }
      .mobile-recipe-icon img { width: 26px; height: 26px; }

      .mobile-recipe-name {
        font-size: 0.9rem;
        color: #2c2c2c;
        line-height: 1.4;
        padding-top: 2px;
        cursor: pointer;
      }

      .mobile-recipe-name:hover { text-decoration: underline; }

      .mobile-empty {
        color: #c8bfb0;
        font-style: italic;
        font-size: 0.85rem;
        padding: 10px 0;
      }

      .today-banner {
        background: #856404;
        color: white;
        text-align: center;
        font-family: 'Poppins', sans-serif;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 6px;
      }
    }

    /* ---- POPUP INGRÉDIENTS ---- */
    #recipe-popup {
      position: fixed;
      inset: 0;
      background: rgba(58,48,40,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #recipe-popup.open { display: flex; }

    .popup-box {
      background: white;
      padding: 24px;
      border-radius: 12px;
      max-width: 380px;
      width: 90%;
      max-height: 70vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(58,48,40,0.2);
    }

    .popup-box h3 {
      font-family: 'Poppins', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      color: #3a3028;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    .popup-box ul { list-style: none; padding: 0; margin: 0; }

    .popup-box ul li {
      padding: 8px 0;
      border-bottom: 1px solid #f0ece3;
      font-size: 0.88rem;
      color: #2c2c2c;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .popup-box ul li:last-child { border-bottom: none; }
  </style>
</head>
<body>

<header>
  <h1>Menus</h1>
  <span class="subtitle" id="header-subtitle">Chargement…</span>
</header>

<div id="desktop-view"></div>

<div id="mobile-view">
  <div class="mobile-nav">
    <button class="nav-btn" id="prev-btn">‹</button>
    <div class="nav-day-label">
      <div class="day-name" id="nav-day-name">—</div>
      <div class="week-name" id="nav-week-name">—</div>
    </div>
    <button class="nav-btn" id="next-btn">›</button>
  </div>
  <div id="today-banner" class="today-banner" style="display:none">Aujourd'hui</div>
  <div class="mobile-day-content" id="mobile-day-content"></div>
</div>

<!-- Popup ingrédients -->
<div id="recipe-popup">
  <div class="popup-box">
    <h3 id="popup-title"></h3>
    <ul id="popup-ingredients"></ul>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const DAYS_ORDER = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi"];
const DAYS_JS    = [0,1,2,3,4,5];

function iconHTML(icon) {
  if (!icon) return '';
  if (icon.startsWith('http')) return `<img src="${icon}" style="width:18px;height:18px;vertical-align:middle;">`;
  return icon;
}
function getCurrentDayIndex() {
  // Renvoie l'index dans DAYS_ORDER correspondant à aujourd'hui (dim=0, lun=1… ven=5)
  const d = new Date().getDay(); // 0=dim, 1=lun … 6=sam
  if (d === 6) return 5; // samedi → vendredi (dernier jour)
  return DAYS_ORDER.findIndex((_, i) => DAYS_JS[i] === d);
}

// Remplace getCurrentDayIndex() et son usage dans renderDesktop/renderMobileSlot

// Retourne la date du lundi de la semaine N du payload
// (le label contient "du 21 avril" — on le parse, ou plus fiable :
//  on recalcule depuis aujourd'hui comme le fait app.js)
function getWeekStartDate(weekIndex) {
  const today = new Date();
  const daysUntilNextMonday = (8 - today.getDay()) % 7 || 7;
  const monday = new Date(today);
  monday.setDate(today.getDate() + daysUntilNextMonday + weekIndex * 7);
  monday.setHours(0, 0, 0, 0);
  return monday;
}

// Retourne la date exacte d'un créneau dans une semaine donnée
function getSlotDate(weekIndex, dayName) {
  const DAYS_ORDER = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi"];
  const dayOffset  = { Dimanche: -1, Lundi: 0, Mardi: 1, Mercredi: 2, Jeudi: 3, Vendredi: 4 };
  const monday = getWeekStartDate(weekIndex);
  const d = new Date(monday);
  d.setDate(monday.getDate() + dayOffset[dayName]);
  return d;
}

// Vérifie si une date est aujourd'hui
function isToday(date) {
  const now = new Date();
  return date.getFullYear() === now.getFullYear()
      && date.getMonth()    === now.getMonth()
      && date.getDate()     === now.getDate();
}

// ---- POPUP ----
const popupEl = document.getElementById('recipe-popup');
popupEl.addEventListener('click', e => { if (e.target === popupEl) popupEl.classList.remove('open'); });

function showIngredients(recipe) {
  document.getElementById('popup-title').textContent = recipe.name || "Sans nom";
  const list = document.getElementById('popup-ingredients');
  list.innerHTML = '';
  (recipe.ingredients || []).forEach(ing => {
    const li = document.createElement('li');
    if (ing.icon) {
      const ico = document.createElement('span');
      ico.innerHTML = ing.icon.startsWith('http')
        ? `<img src="${ing.icon}" style="width:18px;margin-right:4px;vertical-align:middle;">` : ing.icon;
      li.appendChild(ico);
    }
    li.appendChild(document.createTextNode(ing.name));
    list.appendChild(li);
  });
  popupEl.classList.add('open');
}

// ---- DESKTOP ----
function renderDesktop(state) {
  const container = document.getElementById('desktop-view');
  container.innerHTML = '';
  const todayIndex = getCurrentDayIndex();

  state.weeks.forEach((week, wi) => {
    const block = document.createElement('div');
    block.classList.add('week-block');

    const title = document.createElement('div');
    title.classList.add('week-title');
    title.textContent = week.label;
    block.appendChild(title);

    const grid = document.createElement('div');
    grid.classList.add('calendar-grid');

    DAYS_ORDER.forEach((dayName, di) => {
      const col = document.createElement('div');
      col.classList.add('day-col');
      const slotDate = getSlotDate(wi, dayName);
      if (isToday(slotDate)) col.classList.add('today-col');

      const hdr = document.createElement('div');
      hdr.classList.add('day-col-header');
      hdr.textContent = dayName.substring(0, 3);
      col.appendChild(hdr);

      ['midi','soir'].forEach(meal => {
        const slot = document.createElement('div');
        slot.classList.add('meal-slot');

        const badge = document.createElement('span');
        badge.classList.add('meal-badge', meal);
        badge.textContent = meal;
        slot.appendChild(badge);

        const recipes = (week.meals || {})[`${dayName}_${meal}`] || [];

        if (!recipes.length) {
          const empty = document.createElement('span');
          empty.classList.add('empty-slot');
          empty.textContent = '—';
          slot.appendChild(empty);
        } else {
          recipes.forEach(r => {
            const chip = document.createElement('div');
            chip.classList.add('recipe-chip');
            const ico = document.createElement('span');
            ico.classList.add('recipe-icon');
            ico.innerHTML = iconHTML(r.icon);
            const name = document.createElement('span');
            name.textContent = r.name;
            name.style.cursor = 'pointer';
            name.onclick = () => showIngredients(r);
            chip.appendChild(ico);
            chip.appendChild(name);
            slot.appendChild(chip);
          });
        }

        col.appendChild(slot);
      });

      grid.appendChild(col);
    });

    block.appendChild(grid);
    container.appendChild(block);
  });
}

// ---- MOBILE ----
let allSlots = [], currentSlotIndex = 0;

function buildSlots(state) {
  allSlots = [];
  state.weeks.forEach(week => {
    DAYS_ORDER.forEach(dayName => {
      ['midi','soir'].forEach(meal => {
        allSlots.push({
          weekLabel: week.label,
          dayName,
          meal,
          recipes: (week.meals || {})[`${dayName}_${meal}`] || []
        });
      });
    });
  });
}

function renderMobileSlot(idx) {
  const slot = allSlots[idx];
  if (!slot) return;

  document.getElementById('nav-day-name').textContent = `${slot.dayName} ${slot.meal}`;
  document.getElementById('nav-week-name').textContent = slot.weekLabel;
  document.getElementById('prev-btn').disabled = idx === 0;
  document.getElementById('next-btn').disabled = idx === allSlots.length - 1;

  const todayDay = DAYS_ORDER[getCurrentDayIndex()];
  document.getElementById('today-banner').style.display = 'none';

  const content = document.getElementById('mobile-day-content');
  content.innerHTML = '';

  const block = document.createElement('div');
  block.classList.add('mobile-meal-block');

  const lbl = document.createElement('div');
  lbl.classList.add('mobile-meal-label', slot.meal);
  lbl.textContent = slot.meal === 'midi' ? 'Déjeuner' : 'Dîner';
  block.appendChild(lbl);

  if (!slot.recipes.length) {
    const empty = document.createElement('div');
    empty.classList.add('mobile-empty');
    empty.textContent = 'Aucun repas prévu';
    block.appendChild(empty);
  } else {
    slot.recipes.forEach(r => {
      const div = document.createElement('div');
      div.classList.add('mobile-recipe');
      const ico = document.createElement('span');
      ico.classList.add('mobile-recipe-icon');
      ico.innerHTML = iconHTML(r.icon);
      const name = document.createElement('span');
      name.classList.add('mobile-recipe-name');
      name.textContent = r.name;
      name.onclick = () => showIngredients(r);
      div.appendChild(ico);
      div.appendChild(name);
      block.appendChild(div);
    });
  }

  content.appendChild(block);
}

function findTodaySlotIndex() {
  const meal = new Date().getHours() < 14 ? 'midi' : 'soir';
  // Cherche le slot dont la date correspond à aujourd'hui
  const idx = allSlots.findIndex((s, i) => {
    const weekIndex = Math.floor(i / (DAYS_ORDER.length * 2));
    const slotDate  = getSlotDate(weekIndex, s.dayName);
    return isToday(slotDate) && s.meal === meal;
  });
  return idx; // -1 si aucun match (semaine pas encore commencée)
}

// ---- INIT ----
function init() {
  const hash = window.location.hash.slice(1);
  if (!hash) {
    document.getElementById('desktop-view').innerHTML = '<div class="error-msg">Lien invalide ou données manquantes.</div>';
    document.getElementById('mobile-view').style.display = 'none';
    return;
  }

  let state;
  try {
    state = JSON.parse(LZString.decompressFromEncodedURIComponent(hash));
  } catch (e) {
    document.getElementById('desktop-view').innerHTML = '<div class="error-msg">Impossible de lire les données du lien.</div>';
    return;
  }

  document.getElementById('header-subtitle').textContent = state.generatedAt ? `Générés le ${state.generatedAt}` : '';

  renderDesktop(state);
  buildSlots(state);
  currentSlotIndex = findTodaySlotIndex();
  if (currentSlotIndex >= 0) {
    renderMobileSlot(currentSlotIndex);
  } else {
    // Afficher un message "semaine pas encore commencée"
    renderMobileSlot(0); // affiche le premier créneau par défaut
    document.getElementById('today-banner').style.display = 'block';
    document.getElementById('today-banner').textContent   = 'La semaine n\'a pas encore commencé';
  }

  document.getElementById('prev-btn').addEventListener('click', () => {
    if (currentSlotIndex > 0) { currentSlotIndex--; renderMobileSlot(currentSlotIndex); }
  });
  document.getElementById('next-btn').addEventListener('click', () => {
    if (currentSlotIndex < allSlots.length - 1) { currentSlotIndex++; renderMobileSlot(currentSlotIndex); }
  });
}

init();
});
</script>
</body>
</html>
