<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liste de courses</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      background: #faf9f6;
      color: #2c2c2c;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* ---- HEADER ---- */
    header {
      background: #3a3028;
      color: #f0ece3;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f0ece3;
    }

    header .subtitle {
      font-size: 0.72rem;
      opacity: 0.55;
      margin-top: 2px;
      font-style: italic;
    }

    .error-msg {
      text-align: center;
      padding: 60px 24px;
      color: #888;
      font-style: italic;
    }

    .legend {
      text-align: center;
      font-size: 0.72rem;
      color: #c8bfb0;
      padding: 20px;
      font-style: italic;
    }

    /* ---- SECTIONS (rayons) ---- */
    .section { border-bottom: 2px solid #e8e3d8; }

    .section-title {
      background: #3a3028;
      color: #f0ece3;
      font-family: 'Poppins', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 8px 20px;
      position: sticky;
      top: 56px;
      z-index: 5;
    }

    /* ---- SOUS-TITRE SEMAINE (Marché) ---- */
    .week-subtitle {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #856404;
      background: #fffbf0;
      padding: 6px 20px 4px;
      border-top: 1px solid #f0e8d0;
    }

    /* ---- ITEMS ---- */
    .shopping-item {
      display: flex;
      align-items: center;
      padding: 13px 20px;
      border-bottom: 1px solid #f0ece3;
      gap: 12px;
    }

    .shopping-item:last-of-type { border-bottom: none; }
    .shopping-item.checked { opacity: 0.35; }
    .shopping-item.checked .item-label { text-decoration: line-through; }

    .item-check {
      width: 22px;
      height: 22px;
      border: 1.5px solid #c8bfb0;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .shopping-item.checked .item-check { background: #3a3028; border-color: #3a3028; }

    .item-check::after {
      content: '';
      display: none;
      width: 5px;
      height: 9px;
      border: 2px solid #f0ece3;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-1px);
    }

    .shopping-item.checked .item-check::after { display: block; }

    .item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      cursor: pointer;
      min-width: 0;
    }

    .item-icon { font-size: 1.1rem; flex-shrink: 0; width: 22px; text-align: center; }
    .item-icon img { width: 20px; height: 20px; vertical-align: middle; }
    .item-label { font-size: 0.9rem; color: #2c2c2c; }
    .item-count { font-size: 0.78rem; color: #c8bfb0; margin-left: 3px; }

    /* ---- CHAMP AJOUT LIBRE ---- */
    .add-row { padding: 6px 20px 10px; }

    .add-input {
      width: 100%;
      border: none;
      border-top: 1px dashed #e0dbd0;
      background: transparent;
      font-family: inherit;
      font-size: 0.82rem;
      color: #5a5248;
      padding: 8px 2px;
      outline: none;
    }

    .add-input::placeholder { color: #c8bfb0; }
    .add-input:focus { color: #2c2c2c; border-top-color: #3a3028; }

    /* ---- POPUP (slide bas) ---- */
    #recipe-popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(58,48,40,0.45);
      z-index: 100;
      align-items: flex-end;
    }

    #recipe-popup.visible { display: flex; }

    .popup-inner {
      background: #faf9f6;
      width: 100%;
      max-height: 60vh;
      border-radius: 14px 14px 0 0;
      padding: 20px 20px 40px;
      overflow-y: auto;
    }

    .popup-handle {
      width: 36px;
      height: 4px;
      background: #e0dbd0;
      border-radius: 2px;
      margin: 0 auto 18px;
    }

    .popup-inner h3 {
      font-family: 'Poppins', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      color: #3a3028;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    .popup-inner ul { list-style: none; }

    .popup-inner ul li {
      padding: 10px 0;
      border-bottom: 1px solid #f0ece3;
      font-size: 0.9rem;
      color: #2c2c2c;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .popup-inner ul li:last-child { border-bottom: none; }

    .popup-recipe-day {
      font-size: 0.72rem;
      color: #c8bfb0;
      margin-left: auto;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<header>
  <h1>Liste de courses</h1>
  <div class="subtitle" id="header-subtitle">Chargement…</div>
</header>

<div id="list-container"></div>
<div class="legend" id="legend"></div>

<div id="recipe-popup">
  <div class="popup-inner">
    <div class="popup-handle"></div>
    <h3 id="popup-title"></h3>
    <ul id="popup-ingredients"></ul>
  </div>
</div>

<script>
function isMarche(lieu) { return lieu.includes("Marché"); }

const popup = document.getElementById('recipe-popup');
popup.addEventListener('click', e => { if (e.target === popup) popup.classList.remove('visible'); });

function showRecipesPopup(ingredientName, recipes) {
  document.getElementById('popup-title').textContent = ingredientName;
  const list = document.getElementById('popup-ingredients');
  list.innerHTML = '';
  recipes.forEach(r => {
    const li = document.createElement('li');
    if (r.icon) {
      const ico = document.createElement('span');
      ico.innerHTML = r.icon.startsWith('http')
        ? `<img src="${r.icon}" style="width:18px;height:18px;vertical-align:middle;">` : r.icon;
      li.appendChild(ico);
    }
    const nameSpan = document.createElement('span');
    nameSpan.textContent = r.name;
    li.appendChild(nameSpan);
    if (r.day) {
      const daySpan = document.createElement('span');
      daySpan.classList.add('popup-recipe-day');
      daySpan.textContent = r.day;
      li.appendChild(daySpan);
    }
    list.appendChild(li);
  });
  popup.classList.add('visible');
}

function buildRow(ing, data) {
  const row = document.createElement('div');
  row.classList.add('shopping-item');
  const check = document.createElement('div');
  check.classList.add('item-check');
  check.addEventListener('click', () => row.classList.toggle('checked'));
  const left = document.createElement('div');
  left.classList.add('item-left');
  left.addEventListener('click', () => showRecipesPopup(ing, data.recipes || []));
  const iconEl = document.createElement('span');
  iconEl.classList.add('item-icon');
  if (data.icon) {
    iconEl.innerHTML = data.icon.startsWith('http') ? `<img src="${data.icon}" alt="">` : data.icon;
  }
  const label = document.createElement('span');
  label.classList.add('item-label');
  label.textContent = ing;
  if (data.count > 1) {
    const cnt = document.createElement('span');
    cnt.classList.add('item-count');
    cnt.textContent = ` ×${data.count}`;
    label.appendChild(cnt);
  }
  left.appendChild(iconEl);
  left.appendChild(label);
  row.appendChild(check);
  row.appendChild(left);
  return row;
}

function buildAddRow(section, lieu, shopping) {
  const addRow = document.createElement('div');
  addRow.classList.add('add-row');
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = '+ Ajouter un article…';
  input.classList.add('add-input');
  function addItem() {
    const val = input.value.trim();
    if (!val) return;
    const data = { count: 1, recipes: [], icon: null };
    if (isMarche(lieu)) {
      const bucket = 'Ajouts manuels';
      if (!shopping[lieu][bucket]) shopping[lieu][bucket] = {};
      shopping[lieu][bucket][val] = data;
    } else {
      shopping[lieu][val] = data;
    }
    section.insertBefore(buildRow(val, data), addRow);
    input.value = '';
    input.focus();
  }
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
  input.addEventListener('blur', () => { if (input.value.trim()) addItem(); });
  addRow.appendChild(input);
  return addRow;
}

function renderShopping(shopping) {
  const container = document.getElementById('list-container');
  container.innerHTML = '';
  const sortedLieux = Object.keys(shopping).sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
  if (!sortedLieux.length) { container.innerHTML = '<div class="error-msg">Aucun ingrédient.</div>'; return; }
  let total = 0;
  sortedLieux.forEach(lieu => {
    const section = document.createElement('div');
    section.classList.add('section');
    const sTitle = document.createElement('div');
    sTitle.classList.add('section-title');
    sTitle.textContent = lieu.length > 3 ? lieu.slice(3) : lieu;
    section.appendChild(sTitle);
    if (isMarche(lieu)) {
      const weekLabels = Object.keys(shopping[lieu]).sort((a, b) => {
        const na = parseInt(a.match(/\d+/)?.[0] || 0);
        const nb = parseInt(b.match(/\d+/)?.[0] || 0);
        return na - nb;
      });
      weekLabels.forEach(weekLabel => {
        const weekItems = shopping[lieu][weekLabel];
        if (!weekItems || !Object.keys(weekItems).length) return;
        const weekSub = document.createElement('div');
        weekSub.classList.add('week-subtitle');
        weekSub.textContent = weekLabel;
        section.appendChild(weekSub);
        Object.entries(weekItems).forEach(([ing, data]) => { total++; section.appendChild(buildRow(ing, data)); });
      });
    } else {
      Object.entries(shopping[lieu]).forEach(([ing, data]) => { total++; section.appendChild(buildRow(ing, data)); });
    }
    section.appendChild(buildAddRow(section, lieu, shopping));
    container.appendChild(section);
  });
  document.getElementById('legend').textContent = `${total} ingrédients · Appuyez pour voir les recettes`;
}

function init() {
  const hash = window.location.hash.slice(1);
  if (!hash) {
    document.getElementById('list-container').innerHTML = '<div class="error-msg">Lien invalide.</div>';
    document.getElementById('header-subtitle').textContent = '';
    return;
  }
  let state;
  try {
    state = JSON.parse(LZString.decompressFromEncodedURIComponent(hash));
  } catch (e) {
    document.getElementById('list-container').innerHTML = '<div class="error-msg">Impossible de lire les données.</div>';
    return;
  }
  document.getElementById('header-subtitle').textContent = state.generatedAt ? `Générée le ${state.generatedAt}` : '';
  renderShopping(state.shopping || {});
}

init();
</script>
</body>
</html>
