<!DOCTYPE html>
<html lang="fr">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <title>📝 Menus de la semaine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>

</head>

<body>

  <div class="app">
    <h1>📝 Menus de la semaine</h1>
    <div id="loader" style="display: none; text-align:center;margin-top:50px;">
    <img src="/loader.gif" alt="Chargement..." />
    </div>
    <!-- Conteneur principal -->
<div id="weeks-wrapper">
  <div id="weeks-container"></div>
  <div id="add-week-container">
    <button id="add-week-btn">+</button>
  </div>
</div>
<!-- Pop-in ingrédients -->
<div id="recipe-popup" class="hidden">
  <div class="popup-content">
    <h2 id="popup-title"></h2>
    <ul id="popup-ingredients"></ul>
  </div>
</div>

  <div id="shopping-tools">
  <button id="sort-shopping-btn" class="send-mail-btn">Trier la liste de courses</button>
  <div id="shopping-list-container" class="hidden"></div>
</div>
<div id="actions-container">
<button id="generate-links-btn" class="send-mail-btn" style="display:none">🔗 Générer les liens</button>
  </div>
  
 
<div id="links-panel" style="
  display:none;
  padding:20px;
  background:#f3f0ea;
  margin:16px auto;
  border-radius:10px;
  max-width:500px;
  text-align:center;
">
  <div style="margin-bottom:16px;">
    <strong>📋 Liste de courses</strong><br>
    <a id="link-shopping" href="#" target="_blank" style="font-size:0.9rem;"></a><br>
    <button id="copy-shopping-btn" style="margin-top:6px;font-size:0.8rem;">Copier</button>
  </div>
  <div>
    <strong>🗓 Menus</strong><br>
    <a id="link-menus" href="#" target="_blank" style="font-size:0.9rem;"></a><br>
    <button id="copy-menus-btn" style="margin-top:6px;font-size:0.8rem;">Copier</button>
  </div>
</div>
  
<script src="app.js"></script>

<style>
  /* --- Compteur "j'en ai" dans la liste de courses --- */
  .shopping-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .have-wrap {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .have-badge {
    display: none;
    font-size: 0.68rem;
    color: #a09080;
    background: #f0ebe2;
    border: 1px solid #ddd8ce;
    border-radius: 20px;
    padding: 1px 7px;
    white-space: nowrap;
    font-style: italic;
  }

  .have-badge.visible {
    display: inline-block;
  }

  .have-btn {
    background: none;
    border: 1px solid #d0c8be;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    font-size: 0.7rem;
    line-height: 1;
    color: #a09080;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .have-btn:hover {
    background: #f0ebe2;
    border-color: #a09080;
    color: #5a5248;
  }
</style>
</body>
</html>
